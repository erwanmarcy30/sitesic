<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Escape Birthday</title>
  <style>
    :root { font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial; }
    body { margin:0; background:#0b0f19; color:#e9eefc; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 28px; }
    .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px; padding: 16px; margin: 12px 0; }
    h1 { font-size: 22px; margin: 6px 0 10px; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    .muted { opacity: .85; font-size: 14px; line-height: 1.45; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    input {
      flex: 1 1 220px;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.25);
      color:#fff;
      font-size: 16px;
      outline: none;
    }
    button {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: #4c7dff;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    button.secondary { background: rgba(255,255,255,.08); }
    .pill {
      display:inline-block; padding: 6px 10px; border-radius: 999px;
      background: rgba(76,125,255,.18); border:1px solid rgba(76,125,255,.35);
      font-size: 13px;
    }
    .ok { color: #7CFFB2; }
    .bad { color: #ff7c7c; }
    .progress { height:10px; border-radius: 999px; background: rgba(255,255,255,.10); overflow:hidden; }
    .bar { height:100%; width: 0%; background: #4c7dff; transition: width .35s ease; }
    #qr { display:flex; justify-content:center; padding: 12px 0 4px; }
    .footer { text-align:center; opacity:.7; font-size: 12px; margin-top: 12px; }
    a { color: #a9c1ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h1>🎂 Escape Game Anniversaire</h1>
        <span class="pill" id="stepPill">Étape 1 / 4</span>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <p class="muted">
        Réponds aux énigmes pour débloquer la surprise finale.  
        (Le jeu ignore accents/majuscules et tolère plusieurs formats de date.)
      </p>
      <div class="row">
        <button class="secondary" id="resetBtn">Recommencer</button>
        <button class="secondary" id="homeBtn">📲 Mode “appli”</button>
      </div>
    </div>

    <div class="card" id="gameCard">
      <h2 id="qTitle">Énigme</h2>
      <p class="muted" id="qText"></p>

      <div class="row" style="margin-top:10px;">
        <input id="answer" placeholder="Ta réponse…" autocomplete="off" autocapitalize="none" />
        <button id="validateBtn">Valider</button>
      </div>

      <div class="row" style="margin-top:10px; justify-content:space-between;">
        <button class="secondary" id="hintBtn">Indice</button>
        <span id="feedback" class="muted"></span>
      </div>

      <div class="card" id="hintBox" style="display:none; margin-top:12px;">
        <div class="muted" id="hintText"></div>
      </div>
    </div>

    <div class="card" id="finalCard" style="display:none;">
      <h2>🎁 Surprise !</h2>
      <p class="muted">Scanne ce QR code pour accéder à la vidéo.</p>
      <div id="qr"></div>
      <p class="muted" style="text-align:center;">
        (Si besoin : <br />
        <a id="videoLink" href="#" target="_blank" rel="noopener">ouvrir la vidéo</a>)
      </p>
    </div>

  </div>

  <!-- QR via service public simple -->
  <script>
    function makeQR(text, size){
      const url = "https://api.qrserver.com/v1/create-qr-code/?size=" + size + "x" + size + "&data=" + encodeURIComponent(text);
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = url;
      img.alt = "QR Code";
      img.style.width = size + "px";
      img.style.height = size + "px";
      const wrap = document.createElement("div");
      wrap.style.display="inline-block";
      wrap.style.background="white";
      wrap.style.padding="10px";
      wrap.style.borderRadius="14px";
      wrap.style.border="1px solid rgba(255,255,255,.12)";
      wrap.appendChild(img);
      return wrap;
    }
  </script>

  <script>
    // ✅ COLLE ICI TON LIEN VIDÉO (YouTube non répertoriée, Drive, etc.)
    const VIDEO_URL = "https://youtube.com/shorts/BWR21EKprt4?si=leVBMeQbT-GIViXa";

    // Normalisation tolérante
    const norm = (s) => (s || "")
      .toString()
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")       // retire accents
      .replace(/[.,;:!?]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    // Normalisation spéciale "date" (tolère 30/06/2025, 30-6-2025, "30 juin 2025", etc.)
    function normDateInput(s){
      let t = norm(s);

      // Remplace séparateurs variés par "/"
      t = t.replace(/[-.]/g, "/");
      t = t.replace(/\s*\/\s*/g, "/");

      // Mois en lettres -> numéro
      const months = {
        "janvier":"01","janv":"01",
        "fevrier":"02","fev":"02",
        "mars":"03",
        "avril":"04",
        "mai":"05",
        "juin":"06",
        "juillet":"07",
        "aout":"08",
        "septembre":"09","sept":"09",
        "octobre":"10","oct":"10",
        "novembre":"11","nov":"11",
        "decembre":"12","dec":"12"
      };

      // Cas: "30 juin 2025"
      const parts = t.split(" ");
      if (parts.length >= 3) {
        const d = parts[0];
        const m = parts[1];
        const y = parts[2];
        if (months[m] && /^\d{1,2}$/.test(d) && /^\d{4}$/.test(y)) {
          const dd = String(d).padStart(2,"0");
          return `${dd}/${months[m]}/${y}`;
        }
      }

      // Cas: "29/2/2028" -> pad
      const m1 = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m1) {
        const dd = String(m1[1]).padStart(2,"0");
        const mm = String(m1[2]).padStart(2,"0");
        const yy = m1[3];
        return `${dd}/${mm}/${yy}`;
      }

      // Cas: "29 fevrier 2028" (sans "le")
      if (parts.length >= 3 && /^\d{1,2}$/.test(parts[0]) && months[parts[1]] && /^\d{4}$/.test(parts[2])) {
        const dd = String(parts[0]).padStart(2,"0");
        const mm = months[parts[1]];
        const yy = parts[2];
        return `${dd}/${mm}/${yy}`;
      }

      // Sinon: renvoie normalisé simple
      return t;
    }

    // Vérif date flexible: compare sur plusieurs représentations possibles
    function dateMatches(userInput, acceptedDateDDMMYYYY){
      const u = normDateInput(userInput);

      // normalise la date acceptée en dd/mm/yyyy
      const a = acceptedDateDDMMYYYY;

      // On accepte:
      // - dd/mm/yyyy
      // - d/m/yyyy
      // - dd-mm-yyyy (déjà converti)
      // - "dd mois yyyy" (converti)
      // - et une version sans zéros
      const [dd, mm, yy] = a.split("/");
      const noZero = `${Number(dd)}/${Number(mm)}/${yy}`; // ex: 30/6/2025

      return (u === a) || (u === noZero);
    }

    // Étapes (tes questions)
    const STEPS = [
      {
        title: "1) Notre rencontre",
        question: "Quelle est notre date de rencontre ?",
        type: "date",
        accepted: "30/06/2025",
        hint: "Jour + mois + année. Exemple : 30/06/2025 ou 30 juin 2025."
      },
      {
        title: "2) Anniversaire bissextile",
        question: "Si ton anniversaire avait été un 29 février, en quelle année l’aurait-on fêté ?",
        type: "date",
        accepted: "29/02/2028",
        hint: "Pense aux années bissextiles 😉 (réponds avec une date ou juste l’année)."
      },
      {
        title: "3) Le tatouage",
        question: "Quel est le nom de mon tatouage le plus récent ? (prémices de l’aéronautique)",
        type: "text",
        answers: ["icare", "i care", "i-care"],
        hint: "Le mythe grec lié au soleil et aux ailes."
      },
      {
        title: "4) Premier vol",
        question: "Dernière question : quelle est la date de ton premier vol en avion ?",
        type: "date",
        accepted: "28/09/2025",
        hint: "Même format que la question 1."
      }
    ];

    // Pour l'étape 2, tu veux accepter "2028" aussi
    const EXTRA_ACCEPT_STEP2 = ["2028"];

    // --- DOM helpers
    const $ = (id) => document.getElementById(id);
    let step = 0;

    function save(){ localStorage.setItem("escape_step", String(step)); }
    function load(){
      const v = Number(localStorage.getItem("escape_step") || "0");
      if (!Number.isNaN(v)) step = Math.max(0, Math.min(v, STEPS.length));
    }

    function setProgress(){
      const total = STEPS.length;
      const current = Math.min(step + 1, total);
      $("stepPill").textContent = step < total ? `Étape ${current} / ${total}` : `Terminé`;
      $("bar").style.width = ((Math.min(step, total) / total) * 100) + "%";
    }

    function render(){
      const total = STEPS.length;
      setProgress();

      $("feedback").textContent = "";
      $("feedback").className = "muted";
      $("hintBox").style.display = "none";
      $("answer").value = "";

      if (step >= total){
        $("gameCard").style.display = "none";
        $("finalCard").style.display = "block";

        $("videoLink").href = VIDEO_URL;
        $("videoLink").textContent = VIDEO_URL;

        const qr = makeQR(VIDEO_URL, 220);
        const qrWrap = $("qr");
        qrWrap.innerHTML = "";
        qrWrap.appendChild(qr);

        $("bar").style.width = "100%";
        $("stepPill").textContent = "Surprise 🎁";
        return;
      }

      $("gameCard").style.display = "block";
      $("finalCard").style.display = "none";

      const s = STEPS[step];
      $("qTitle").textContent = s.title;
      $("qText").textContent = s.question;
      $("hintText").textContent = "💡 " + s.hint;
    }

    function validate(){
      const userRaw = $("answer").value;

      if (!userRaw.trim()){
        $("feedback").textContent = "Écris une réponse 🙂";
        $("feedback").className = "muted bad";
        return;
      }

      const s = STEPS[step];
      let ok = false;

      if (s.type === "date"){
        // Etape 2 : accepte aussi "2028"
        if (step === 1) {
          const u = norm(userRaw);
          if (EXTRA_ACCEPT_STEP2.includes(u)) ok = true;
        }
        if (!ok) ok = dateMatches(userRaw, s.accepted);
      } else {
        const u = norm(userRaw);
        ok = s.answers.map(norm).includes(u);
      }

      if (ok){
        $("feedback").textContent = "✅ Bien joué !";
        $("feedback").className = "muted ok";
        step++; save();
        setTimeout(render, 450);
      } else {
        $("feedback").textContent = "❌ Pas encore… réessaie.";
        $("feedback").className = "muted bad";
      }
    }

    // Events
    $("validateBtn").addEventListener("click", validate);
    $("answer").addEventListener("keydown", (e)=>{ if(e.key==="Enter") validate(); });

    $("hintBtn").addEventListener("click", ()=>{
      const box = $("hintBox");
      box.style.display = (box.style.display === "none") ? "block" : "none";
    });

    $("resetBtn").addEventListener("click", ()=>{
      step = 0; save(); render();
    });

    $("homeBtn").addEventListener("click", ()=>{
      alert("Sur iPhone : Safari → Partager (carré + flèche) → 'Sur l’écran d’accueil'.\nTu auras un mode plein écran comme une appli.");
    });

    load();
    render();
  </script>
</body>
</html>
